# main 에 푸시하면 테스트 → 이미지 빌드 → ECR 푸시 → EC2 재기동까지 자동으로 간다.
#
# ★ 배포 지시를 SSH 가 아니라 <b>SSM Run Command</b> 로 보낸다. GitHub 러너의 IP 는 수십만 개라
#   SSH 로 하려면 22번을 사실상 0.0.0.0/0 으로 열어야 한다. SSM 은 EC2 안의 에이전트가 AWS 로
#   <b>나가서</b> 명령을 받아 오는 구조라 들어오는 포트를 하나도 열지 않는다. SSH 개인키를
#   저장소 시크릿에 넣지 않아도 되는 것은 덤이다.
#
# 필요한 것 (저장소 Settings → Secrets and variables → Actions):
#   Secret   AWS_ACCESS_KEY_ID       IAM 사용자 portfolio-gha 의 키
#   Secret   AWS_SECRET_ACCESS_KEY
#   Variable EC2_INSTANCE_ID         i-0000000000000000
#
# EC2 쪽 준비물 — 인스턴스 역할(portfolio-ec2-role)에 AmazonSSMManagedInstanceCore 가
# 붙어 있어야 한다. 없으면 에이전트가 SSM 에 등록되지 않아 InvalidInstanceId 로 즉시 실패한다.
#
# ⚠ .env 는 자동화하지 않는다. ECR_IMAGE 는 "지금 그 서버에 무엇이 떠 있는가" 라서
#   저장소가 아니라 서버가 가질 값이다. deploy.sh 가 인자를 받아 알아서 갱신한다.

name: Deploy to EC2

on:
  push:
    branches: [main]
  # 코드 변경 없이 다시 배포하거나, 예전 커밋으로 되돌릴 때 쓴다.
  workflow_dispatch:

# 배포가 겹치면 컨테이너를 서로 갈아끼우다 꼬인다. 앞선 배포를 죽이지는 않는다(취소하면
# ECR 푸시만 되고 EC2 는 옛 이미지로 남는 어중간한 상태가 생긴다).
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPO: portfolio

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ⚠ chmod 가 필요하다 — gradlew 가 git 에 100644(실행 권한 없음)로 들어 있다.
      # ★ 테스트를 이미지 빌드 안이 아니라 여기서 돌린다. 러너에 Gradle 캐시가 있어 빠르고,
      #   실패를 이미지 빌드보다 앞에서 잡는다. 이 프로젝트는 DB 가 없어 외부 준비물이 없다.
      - name: 테스트
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: 짧은 커밋 해시
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ⚠ 빈 시크릿을 여기서 잡는다. gh secret set 은 값을 못 받아도 "성공"으로 표시해서
      #   이름만 있고 값이 빈 시크릿이 생긴다. 그대로 두면 다음 단계가
      #   "Could not load credentials from any providers" 라는 엉뚱한 말로 죽어,
      #   자격 증명이 틀린 것인지 비어 있는 것인지 알 수 없다(실제로 한 번 겪었다).
      - name: 시크릿 확인
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          [ -n "$KEY_ID" ]     || { echo "저장소 Secret AWS_ACCESS_KEY_ID 가 비어 있습니다 — gh secret set 을 --body 로 다시 넣으세요." >&2; exit 1; }
          [ -n "$KEY_SECRET" ] || { echo "저장소 Secret AWS_SECRET_ACCESS_KEY 가 비어 있습니다 — gh secret set 을 --body 로 다시 넣으세요." >&2; exit 1; }
          echo "시크릿 두 개 모두 값이 들어 있습니다."

      - name: AWS 자격 증명
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      # ⚠ context 가 저장소 루트(.)다 — 이 저장소는 단일 모듈이라 Dockerfile 이
      #   `COPY gradle gradle` 처럼 루트를 기준으로 쓴다.
      # ★ 태그를 둘 붙인다. latest 는 사람이 부르기 쉬운 이름이고, 짧은 해시는 되돌아갈 지점이다.
      #   형식을 build-and-push.sh(rev-parse --short)와 맞춰 ECR 목록에서 섞이지 않게 한다.
      - name: 이미지 빌드·푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ⚠ Variables 와 Secrets 둘 다 받는다. 설정 화면에 탭이 둘이라 헷갈리기 쉽다.
      #   인스턴스 ID 는 <b>비밀이 아니라서</b> 어느 쪽에 있든 기능상 차이가 없다.
      #   ★ 제자리는 Variables 다 — Secrets 에 넣으면 로그에서 *** 로 가려져 디버깅이 어려워진다.
      - name: EC2 에 배포 (SSM)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || secrets.EC2_INSTANCE_ID }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          if [ -z "${INSTANCE_ID}" ]; then
            echo "저장소 Variable(또는 Secret) EC2_INSTANCE_ID 가 비어 있습니다 — Settings → Secrets and variables → Actions" >&2
            exit 1
          fi

          echo "▸ 배포 명령 전송 → ${INSTANCE_ID}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "portfolio ${GITHUB_SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters "commands=[\"bash /opt/portfolio/deploy.sh ${IMAGE}\"]" \
            --query Command.CommandId --output text)
          echo "  CommandId=${CMD_ID}"

          # ⚠ 보낸 직후에는 InvocationDoesNotExist 가 잠깐 뜬다 — 실패로 보면 안 된다.
          STATUS=Pending
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "${STATUS}" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          echo "── EC2 출력 ─────────────────────────────"
          aws ssm get-command-invocation --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
            --query StandardOutputContent --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "── 오류 출력 ────────────────────────────" >&2
            aws ssm get-command-invocation --command-id "${CMD_ID}" --instance-id "${INSTANCE_ID}" \
              --query StandardErrorContent --output text >&2 || true
            echo "배포 실패 (Status=${STATUS})" >&2
            exit 1
          fi
          echo "배포 성공 — ${IMAGE}"
