<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${project.name} + ' · ' + ${owner.name})}">
    <meta charset="UTF-8">
    <title>프로젝트 상세</title>
</head>
<body>

<aside th:replace="~{layout/base :: rail}"></aside>

<main id="app">
    <div class="page">

        <div class="phead">
            <a class="back" th:href="@{'/' + ${project.kind.path}}"
               th:text="'← ' + ${project.kind.label}">← 목록</a>
            <span class="lab lab-block"
                  th:text="${project.kind.labelEn} + ' · ' + ${project.period}">Personal · 기간</span>
            <h1 class="sh" th:text="${project.name}">프로젝트</h1>
            <div class="tg" th:text="${project.tagline}">한 줄 소개</div>
        </div>

        <div class="dgrid">
            <div class="dshots">
                <div class="slider" data-slider tabindex="0" role="region"
                     th:attr="aria-label=${project.name} + ' 화면 갤러리'">
                    <div class="slider-window">
                        <div class="slider-track" data-track>
                            <div class="slide" data-slide th:each="shot : ${project.shots}">
                                <figure th:replace="~{fragments/project :: frame(${project}, ${shot})}"></figure>
                            </div>
                        </div>
                    </div>
                    <div th:replace="~{fragments/project :: controls(${project.shots.size()})}"></div>
                </div>
            </div>

            <div class="dblocks">
                <div class="block">
                    <span class="lab">Overview</span>
                    <p class="prose" th:each="para : ${project.description}" th:text="${para}">상세 설명</p>
                </div>

                <div class="block" th:if="${!project.contributions.isEmpty()}">
                    <span class="lab">My Role</span>
                    <div class="item" th:each="part : ${project.contributions}">
                        <b th:text="${part.title}">담당 범위</b>
                        <span th:text="${part.body}">설명</span>
                    </div>
                </div>

                <div class="block">
                    <span class="lab">Features</span>
                    <div class="item" th:each="feature : ${project.features}">
                        <b th:text="${feature.title}">기능</b>
                        <span th:text="${feature.body}">설명</span>
                    </div>
                </div>

                <div class="block" th:if="${!project.issues.isEmpty()}">
                    <span class="lab">Troubleshooting</span>
                    <div class="item" th:each="issue : ${project.issues}">
                        <b th:text="${issue.title}">문제</b>
                        <span th:text="${issue.body}">해결</span>
                    </div>
                </div>
            </div>

            <aside class="side">
                <span class="lab">Stack</span>
                <div th:replace="~{fragments/project :: stack(${project.stack})}"></div>
                <div class="gap"></div>
                <span class="lab">Links</span>
                <div th:replace="~{fragments/project :: actions(${project}, false)}"></div>
                <div th:if="${project.sample}"><span class="sample">예시 데이터</span></div>
            </aside>
        </div>

    </div>
</main>

<script th:src="@{/js/slider.js}" defer></script>
</body>
</html>
